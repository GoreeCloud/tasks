schema_version: '0.4'

component:
  type: application
  id: goreecloud-tasks
  product_name: GoreeCloud Tasks
  repository: GoreeCloud/tasks

lifecycle: development
version: '0.1'

supported_platforms:
  - web
  - linux-server

api:
  versions:
    - v1
  endpoints:
    - name: health
      url: /health/
      purpose: Non-sensitive application liveness interface.
    - name: manager-operational-tasks
      url: /api/v1/manager/operational-tasks/
      purpose: Read-only authorization-scoped operational task visibility for GoreeCloud Manager.

platform_systems:
  manager:
    result: applicable-migration-required
    version: null
    evidence:
      - docs/manager-api.md
      - docs/manager-cross-application-validation.md
      - docs/manager-final-topology-validation.md
      - docs/manager-integration-credential-lifecycle.md
    notes: A source-level read-only Manager integration and dedicated validation exist, but canonical Mesh-backed platform registration, current-contract mapping, and production Manager integration acceptance remain incomplete.

  privacy_shield:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - docs/PLATFORM_CONFORMANCE.md
    notes: Tasks implements privacy-first authorization and data-minimization behavior, but no accepted Privacy Shield runtime contract, decision lifecycle, evidence integration, or production acceptance is established.

  wardveil_security:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - docs/PLATFORM_CONFORMANCE.md
    notes: Tasks has substantive security and secret-handling controls, but no accepted Wardveil Security runtime integration, producer evidence, or production security acceptance is established.

  everkeep:
    result: applicable-blocked
    version: null
    evidence:
      - docs/backup-operations-readiness.md
      - docs/backup-restoration-validation.md
      - docs/full-environment-recovery-readiness.md
    notes: Tasks has backup, restoration, export, and recovery foundations, but accepted Everkeep integration and target-environment recovery evidence remain incomplete.

  glaze_ui:
    result: applicable-migration-required
    version: '1.0.0'
    evidence:
      - docs/glaze-ui.md
      - static/css/glaze.css
      - scripts/validate_glaze_ui_consumer.py
      - scripts/validate_glaze_ui_rendered.py
    notes: Repository-local Glaze UI 1.0.0 source mapping and automated validation are present. Current shared Stable authority is Glaze UI 1.6.0; migration plus exact-revision rendered, accessibility, performance, rollback, release, and production acceptance remain incomplete.

  mesh:
    result: applicable-blocked
    version: null
    evidence:
      - docs/PLATFORM_CONFORMANCE.md
    notes: Canonical GoreeCloud Mesh registration, capability publication, producer evidence, dependency declaration, and runtime coordination acceptance are not established for Tasks.
    capabilities: []
    dependencies: []
    published_events: []
    consumed_events: []

  identity:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - docs/PLATFORM_CONFORMANCE.md
    notes: Tasks currently owns its Django user model and has not completed accepted GoreeCloud Identity integration, migration, authorization, isolation, revocation, or production acceptance.

  policy:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - docs/PLATFORM_CONFORMANCE.md
    notes: GoreeCloud Policy is applicable to shared administrative, authorization, retention, notification, collaboration, and operational policy decisions, but no accepted Policy runtime evaluation, distribution, enforcement-coordination, explanation, freshness, exception, or evidence integration exists.

  observability:
    result: applicable-blocked
    version: null
    evidence:
      - docs/PLATFORM_CONFORMANCE.md
      - scripts/tasks_production_readiness_manifest.json
    notes: Tasks exposes a bounded health endpoint and has production-readiness evidence, but no accepted GoreeCloud Observability health, metrics, events, diagnostics, dependency-health, freshness, alerting, or production operational acceptance exists.

health:
  health_endpoint: /health/
  readiness_endpoint: null

continuity:
  backup:
    required: true
    requirements:
      - Preserve PostgreSQL application data, application configuration, protected secrets, and deployment manifests.
      - Establish accepted Everkeep-compatible production backup scheduling, retention, integrity, monitoring, and independent recovery-copy evidence.
  restore:
    required: true
    requirements:
      - Validate clean-target restoration of application data, configuration, publication, and service health.
      - Complete an isolated production-representative restore and full-environment recovery exercise before Stable qualification.
  export:
    required: true
    requirements:
      - Preserve authorization-scoped user and owner-only project archive export without widening collaboration access into bulk-export authority.
      - Keep credentials, sessions, access tokens, and unrelated private records out of portable archives.
  portability:
    required: true
    requirements:
      - Preserve supported GoreeCloud Tasks user/project archive formats and relationship integrity across clean-target import or restoration.
      - Preserve provider-neutral migration boundaries and fail closed on invalid or unauthorized relationships.

external_dependencies:
  - name: Django
    purpose: Application web framework and ORM foundation.
    required: true
    version_constraint: null
  - name: PostgreSQL
    purpose: Multi-user production database target and validated container-development database.
    required: true
    version_constraint: null
  - name: ntfy
    purpose: Optional private reminder-delivery service behind a least-privilege publisher boundary.
    required: false
    version_constraint: null

compatibility:
  platform_contract: '0.4'
  glaze_ui_required: '1.6.0'
  requires:
    - goreecloud-platform-contract==0.4
    - glaze-ui==1.6.0
  provides:
    - goreecloud.tasks.manager.v1

evidence:
  acceptance_tests: []
  release: []

conformance:
  status: nonconformant
  validated_at: null
  evidence:
    - README.md
    - docs/PLATFORM_CONFORMANCE.md
    - docs/glaze-ui.md
    - static/css/glaze.css
    - scripts/validate_glaze_ui_consumer.py
    - scripts/validate_glaze_ui_rendered.py
    - docs/manager-api.md
    - docs/manager-cross-application-validation.md
    - docs/manager-final-topology-validation.md
    - docs/backup-operations-readiness.md
    - docs/backup-restoration-validation.md
    - docs/full-environment-recovery-readiness.md
    - docs/feature-portable-export.md
    - scripts/tasks_production_readiness_manifest.json
  blockers:
    - GoreeCloud Tasks remains Development and Contract 0.4 adoption does not authorize Release Candidate, production deployment, or Stable qualification.
    - Repository-local Glaze UI 1.0.0 remains migration-required against current shared Stable Glaze UI 1.6.0, with application rendered/accessibility/performance/rollback/release/production acceptance incomplete.
    - GoreeCloud Identity integration and migration are incomplete.
    - Wardveil Security runtime integration and production acceptance are not established.
    - Privacy Shield runtime integration and privacy acceptance are not established.
    - Everkeep integration plus accepted production backup and isolated restore evidence are incomplete.
    - GoreeCloud Mesh registration, evidence publication, and runtime acceptance are not established.
    - Production Manager identity, network, credential, and end-to-end integration evidence remain outstanding.
    - GoreeCloud Policy runtime evaluation, enforcement-coordination, explanation, freshness, exception, and evidence integration are not established.
    - GoreeCloud Observability health, metrics, diagnostics, dependency-health, freshness, alerting, and production operational acceptance are not established.
    - Target-environment production, monitoring, recovery, publication, and release evidence remain outstanding.
