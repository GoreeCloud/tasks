[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "goreecloud-tasks-server"
version = "0.1.0"
description = "Local-first self-hosted GoreeCloud Tasks API"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "python-dateutil>=2.9,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["goreecloud_tasks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
