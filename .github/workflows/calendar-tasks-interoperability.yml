name: Pinned Tasks-to-Calendar VTODO compatibility contract

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  calendar-interop-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout Tasks without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout source-reviewed Calendar draft at immutable commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: GoreeCloud/calendar
          ref: bea6665b31b81fc9bf4310c3fc071b3c2ed519e6
          path: calendar-source
          persist-credentials: false
      - name: Setup Python for isolated stdlib contract tests
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact source commit and actual parser implementation blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C calendar-source rev-parse HEAD)" = 'bea6665b31b81fc9bf4310c3fc071b3c2ed519e6'
          test "$(git -C calendar-source hash-object calendar_app/vtodo.py)" = '2826094ae2464e7eea0b7554fd1924974e1cfd4c'
          test "$(git -C calendar-source hash-object calendar_app/ical.py)" = '97e11b64490994491a59ab00d8a80485fc28b72e'
      - name: Prove fail-closed Tasks preflight against genuine Calendar parser
        shell: bash
        env:
          GC_CALENDAR_SOURCE_DIR: calendar-source
          PYTHONNOUSERSITE: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 -m unittest discover -s server/tests -p 'test_calendar*.py' -v
