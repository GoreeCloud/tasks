name: Verify Tasks foundation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web-and-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Web model tests
        run: node --check web/app.mjs && node --test web/*.test.mjs
      - name: Python store tests
        run: python3 -m unittest discover -s linux/tests -v
      - name: Compile Python syntax
        run: python3 -m py_compile linux/app.py linux/store.py
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile native Android debug APK
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace
