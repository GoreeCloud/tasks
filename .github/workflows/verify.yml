name: Verify Tasks foundation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web-and-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Web model tests
        run: node --check web/app.mjs && node --test web/*.test.mjs
      - name: Python store tests
        run: python3 -m unittest discover -s linux/tests -v
      - name: Compile Python syntax
        run: python3 -m py_compile linux/app.py linux/store.py linux/backup.py linux/tests/gui_smoke.py
      - name: Isolated Linux user install/uninstall smoke
        run: sh -n linux/install.sh && sh -n linux/uninstall.sh && sh linux/tests/test_install.sh

  linux-gtk-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install GTK runtime dependencies with bounded APT network wait
        shell: bash
        run: |
          set -euo pipefail
          # A DNS outage on the hosted Ubuntu mirror must report an explicit
          # infrastructure error, not cancel unrelated web/Linux unit checks.
          if ! sudo timeout -k 5s 180s apt-get -o Acquire::Retries=1 \
              -o APT::Update::Error-Mode=any -o Acquire::http::Timeout=20 \
              -o Acquire::https::Timeout=20 update -qq; then
            echo "::error::GTK runtime APT index update failed (network/mirror); native smoke was not executed"
            exit 1
          fi
          if ! sudo timeout -k 5s 180s apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 \
              install -y --no-install-recommends python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 xvfb xauth; then
            echo "::error::GTK runtime packages unavailable; native smoke was not executed"
            exit 1
          fi
      - name: Native GTK4/libadwaita runtime smoke
        run: xvfb-run -a /usr/bin/python3 linux/tests/gui_smoke.py

  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Experimental loopback API integration tests
        run: python3 -m unittest discover -s server/tests -v
      - name: Python API syntax
        run: python3 -m py_compile server/api.py server/backup.py server/outbox.py server/bootstrap_client.py server/loopback_bootstrap.py server/vtodo_export.py server/path_guard.py server/retry_receipts.py
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile native Android debug APK
        run: gradle -p android :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Verify debug APK identity permissions backup policy signature and checksum
        run: sh android/tests/verify_debug_apk.sh android/app/build/outputs/apk/debug/app-debug.apk
      # CI transport only: GitHub wraps this in a ZIP. It is NOT the user's
      # required standalone .apk delivery to GoreeCloud/Artifacts in Drive.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tasks-android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
